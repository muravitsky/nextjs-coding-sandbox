# -------------------------------------------------------
# Replace the values below with your SonarCloud details.
# Project key format: <org>_<repo-name>
# -------------------------------------------------------
sonar.projectKey=nextjs-coding-sandbox
sonar.organization=muravitsky

sonar.projectName=nextjs-coding-sandbox
sonar.projectVersion=1.0

# Source & test paths
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=node_modules/**,.next/**,coverage/**,**/*.stories.*

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json
