name: CD

# Triggered when CI completes on main.
# deploy-preview runs first; quality gates run in parallel against it;
# deploy-production only runs when all quality gates pass.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Deploy preview ──────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy to Vercel (Preview)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts via Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifacts to Vercel (Preview)
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 2a. DAST: OWASP ZAP baseline scan ─────────────────────────────────────
  dast-zap:
    name: DAST – OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ needs.deploy-preview.outputs.preview_url }}
          fail_action: true

  # ── 2b. Sanity tests: robots / sitemap / broken links ──────────────────────
  sanity-tests:
    name: Sanity – robots / sitemap / links
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Wait for preview to be ready
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview_url }}"
          echo "Waiting for $PREVIEW_URL..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL")
            if [ "$STATUS" = "200" ]; then
              echo "Preview is ready (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS – retrying in 5s..."
            sleep 5
          done

      - name: Check robots.txt
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/robots.txt")
          echo "robots.txt HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "robots.txt returned $STATUS" && exit 1)

      - name: Check sitemap.xml
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/sitemap.xml")
          BODY=$(curl -s "$PREVIEW_URL/sitemap.xml")
          echo "sitemap.xml HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "sitemap.xml returned $STATUS" && exit 1)
          echo "$BODY" | xmllint --noout - || (echo "sitemap.xml is not valid XML" && exit 1)
          echo "sitemap.xml is valid XML"

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress ${{ needs.deploy-preview.outputs.preview_url }}
          fail: true

  # ── 2c. Accessibility: axe-core WCAG 2.2 AA ───────────────────────────────
  accessibility:
    name: Accessibility – axe-core WCAG 2.2 AA
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Run axe-cli
        run: |
          npx axe-cli ${{ needs.deploy-preview.outputs.preview_url }} \
            --tags wcag2a,wcag2aa \
            --exit

  # ── 2d. Core Web Vitals: Unlighthouse ──────────────────────────────────────
  cwv-unlighthouse:
    name: CWV – Unlighthouse
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Run Unlighthouse CI
        run: |
          npx unlighthouse-ci \
            --site ${{ needs.deploy-preview.outputs.preview_url }} \
            --budget performance:80,accessibility:90,best-practices:90,seo:90

  # ── 2e. Security headers ───────────────────────────────────────────────────
  security-headers:
    name: Security – HTTP headers check
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Check security headers
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview_url }}"
          HEADERS=$(curl -sI "$PREVIEW_URL")
          echo "$HEADERS"

          FAIL=0

          check_header() {
            local header="$1"
            if echo "$HEADERS" | grep -qi "^$header:"; then
              echo "OK  $header"
            else
              echo "MISSING  $header"
              FAIL=1
            fi
          }

          check_header "strict-transport-security"
          check_header "x-content-type-options"
          check_header "x-frame-options"
          check_header "content-security-policy"
          check_header "referrer-policy"
          check_header "permissions-policy"

          [ "$FAIL" = "0" ] || (echo "One or more required security headers are missing" && exit 1)

  # ── 2f. E2E smoke tests: Playwright ───────────────────────────────────────
  e2e-tests:
    name: E2E – Playwright smoke tests
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npx playwright test --grep "home page loads"
        env:
          BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}

  # ── 2g. Visual regression: Playwright screenshots ─────────────────────────
  visual-regression:
    name: Visual – Playwright screenshot diff
    runs-on: ubuntu-latest
    needs: deploy-preview
    continue-on-error: true  # warn, not block — baselines need initial commit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npx playwright test --grep "visual snapshot"
        env:
          BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: test-results/

  # ── 2h. Load testing: k6 ──────────────────────────────────────────────────
  load-testing:
    name: Load – k6 (10 VUs / 30s)
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-tests/home.js
        env:
          TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}

  # ── 3. Deploy production (all quality gates must pass) ─────────────────────
  deploy-production:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs:
      - dast-zap
      - sanity-tests
      - accessibility
      - cwv-unlighthouse
      - security-headers
      - e2e-tests
      - visual-regression
      - load-testing
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifacts to Vercel (Production)
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to production: $DEPLOYMENT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
