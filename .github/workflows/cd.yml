name: CD

# Triggered when CI completes on main.
# deploy-preview runs first; quality gates run in parallel against it;
# deploy-production only runs when all quality gates pass.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Deploy preview ──────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy to Vercel (Preview)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment: production
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts via Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifacts to Vercel (Preview)
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 2a. Sanity tests: robots / sitemap / broken links ──────────────────────
  sanity-tests:
    name: Sanity – robots / sitemap / links
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Wait for preview to be ready
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview_url }}"
          BYPASS="${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          echo "Waiting for $PREVIEW_URL..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              "$PREVIEW_URL")
            if [ "$STATUS" = "200" ]; then
              echo "Preview is ready (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS – retrying in 5s..."
            sleep 5
          done

      - name: Run checks and generate summary
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview_url }}"
          BYPASS="${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          FAIL=0

          curl_status() { curl -s -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: $BYPASS" "$1"; }
          curl_body()   { curl -s -H "x-vercel-protection-bypass: $BYPASS" "$1"; }
          icon()        { [ "$1" = "200" ] && echo "✅" || echo "❌"; }

          # ── Summary header ────────────────────────────────────────────────
          {
            echo "# Sanity – robots / sitemap / links"
            echo ""
            echo "**Preview:** [$PREVIEW_URL]($PREVIEW_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # ── Endpoint checks ───────────────────────────────────────────────
          {
            echo "## Endpoint checks"
            echo ""
            echo "| Endpoint | URL | Status |"
            echo "|----------|-----|:------:|"
          } >> "$GITHUB_STEP_SUMMARY"

          ROBOTS_STATUS=$(curl_status "$PREVIEW_URL/robots.txt")
          [ "$ROBOTS_STATUS" != "200" ] && FAIL=1
          echo "| \`robots.txt\` | [$PREVIEW_URL/robots.txt]($PREVIEW_URL/robots.txt) | $(icon $ROBOTS_STATUS) \`$ROBOTS_STATUS\` |" \
            >> "$GITHUB_STEP_SUMMARY"

          SITEMAP_BODY=$(curl_body "$PREVIEW_URL/sitemap.xml")
          SITEMAP_STATUS=$(curl_status "$PREVIEW_URL/sitemap.xml")
          [ "$SITEMAP_STATUS" != "200" ] && FAIL=1
          echo "$SITEMAP_BODY" | xmllint --noout - 2>/dev/null \
            && XML_NOTE="valid XML" || { XML_NOTE="invalid XML"; FAIL=1; }
          echo "| \`sitemap.xml\` ($XML_NOTE) | [$PREVIEW_URL/sitemap.xml]($PREVIEW_URL/sitemap.xml) | $(icon $SITEMAP_STATUS) \`$SITEMAP_STATUS\` |" \
            >> "$GITHUB_STEP_SUMMARY"

          # ── Sitemap URLs ──────────────────────────────────────────────────
          {
            echo ""
            echo "## Sitemap URLs"
            echo ""
            echo "| URL | Status |"
            echo "|-----|:------:|"
          } >> "$GITHUB_STEP_SUMMARY"

          SITEMAP_URLS=$(echo "$SITEMAP_BODY" | grep -oP '(?<=<loc>)[^<]+')
          for URL in $SITEMAP_URLS; do
            S=$(curl_status "$URL")
            [ "$S" != "200" ] && FAIL=1
            echo "| [$URL]($URL) | $(icon $S) \`$S\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          # ── Page links ────────────────────────────────────────────────────
          {
            echo ""
            echo "## Page links"
            echo ""
            echo "| URL | Status |"
            echo "|-----|:------:|"
          } >> "$GITHUB_STEP_SUMMARY"

          PAGE_HTML=$(curl_body "$PREVIEW_URL")
          # Absolute hrefs only; skip _next internals, anchors, mailto, javascript
          PAGE_LINKS=$(echo "$PAGE_HTML" \
            | grep -oP '(?<=href=")[^"]+' \
            | grep -P '^https?://' \
            | grep -v '_next/' \
            | sort -u)

          if [ -z "$PAGE_LINKS" ]; then
            echo "| — | no external links found |" >> "$GITHUB_STEP_SUMMARY"
          else
            for LINK in $PAGE_LINKS; do
              S=$(curl -s -o /dev/null -w "%{http_code}" "$LINK")
              echo "| [$LINK]($LINK) | $(icon $S) \`$S\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          # ── Footer ────────────────────────────────────────────────────────
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL" = "0" ]; then
            echo "> ✅ All checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ❌ One or more checks failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ── 2b. Core Web Vitals: Unlighthouse ──────────────────────────────────────
  cwv-unlighthouse:
    name: CWV – Unlighthouse
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Run Unlighthouse CI
        run: |
          npx unlighthouse-ci \
            --site ${{ needs.deploy-preview.outputs.preview_url }} \
            --budget performance:80,accessibility:90,best-practices:90,seo:90

  # ── 2c. Security headers ───────────────────────────────────────────────────
  security-headers:
    name: Security – HTTP headers check
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Check security headers
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview_url }}"
          BYPASS="${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          HEADERS=$(curl -sI -H "x-vercel-protection-bypass: $BYPASS" "$PREVIEW_URL")
          echo "$HEADERS"

          FAIL=0

          check_header() {
            local header="$1"
            if echo "$HEADERS" | grep -qi "^$header:"; then
              echo "OK  $header"
            else
              echo "MISSING  $header"
              FAIL=1
            fi
          }

          check_header "strict-transport-security"
          check_header "x-content-type-options"
          check_header "x-frame-options"
          check_header "content-security-policy"
          check_header "referrer-policy"
          check_header "permissions-policy"

          [ "$FAIL" = "0" ] || (echo "One or more required security headers are missing" && exit 1)

  # ── 2d. E2E smoke tests: Playwright ───────────────────────────────────────
  e2e-tests:
    name: E2E – Playwright smoke tests
    runs-on: ubuntu-latest
    needs: deploy-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npx playwright test --grep "home page loads"
        env:
          BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}

  # ── 3. Deploy production (all quality gates must pass) ─────────────────────
  deploy-production:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs:
      - sanity-tests
      - cwv-unlighthouse
      - security-headers
      - e2e-tests
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifacts to Vercel (Production)
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to production: $DEPLOYMENT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
